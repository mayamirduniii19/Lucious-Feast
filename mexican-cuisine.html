<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mexican Cuisine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cookie&family=Dancing+Script:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Jost:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Prata&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Ensures padding doesn't break layout */
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #f9f9f9;
        }

        /* --- Header Styles --- */
        .header {
            min-height: 40vh; /* Reduced height for sub-pages */
            width: 100%;
            /* Kept your local path */
            background-image: linear-gradient(rgba(168, 170, 180, 0.671), rgba(168, 170, 180, 0.671)), url("E:\\sem II\\project\\LuciousFeast\\public\\Untitled design (2).png");
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .header h1 {
            font-family: "Prata", serif;
            font-size: 50px;
            color: #4e0101;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 40px;
            border-radius: 5px;
            z-index: 2;
        }

        /* --- Navigation --- */
        nav {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #4e0101;
            font-family: "Cookie", cursive;
            font-size: 28px;
            background: rgba(255, 255, 255, 0.4);
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* --- The Main Grid System --- */
        .dish-section {
            padding: 50px 10%; /* 10% side padding centers everything nicely */
        }

        h2 {
            text-align: center;
            font-family: "Prata", serif;
            font-size: 36px;
            margin-bottom: 40px;
            color: #333;
        }

        /* The Container for all cards */
        .row {
            display: flex;
            flex-wrap: wrap; /* Allows cards to wrap to next line */
            justify-content: center; /* Centers cards */
            gap: 30px; /* Space between cards */
        }

        /* The Individual Card */
        .col {
            flex-basis: 300px; /* Base width */
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Soft shadow */
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hover Animation */
        .col:hover {
            transform: translateY(-10px); /* Moves up */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); /* Shadow grows */
            background-color: #fff; /* Ensure it stays white */
        }

        /* Image Styling */
        .col img {
            width: 100%;
            height: 200px; /* Fixed height for uniformity */
            object-fit: cover; /* Crops image neatly */
            border-radius: 5px;
            margin-bottom: 15px;
        }

        /* Title Styling */
        .col h3 {
            font-family: "Prata", serif;
            font-size: 22px;
            color: #4e0101;
            margin-bottom: 5px;
            text-align: center;
        }

        /* --- Footer & Button Styles --- */
        footer {
            text-align: center;
            padding: 40px 20px;
            background: #333;
            margin-top: 50px;
        }

        /* The Button Look */
        footer a {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 35px;
            font-size: 18px;
            font-family: "Prata", serif;
            letter-spacing: 1px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        footer a:hover {
            background-color: #fff;
            color: #333;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

    </style>
</head>
<body>

    <section class="header">
        <nav>
            <a href="project.html">Home</a>
        </nav>
        <h1>Mexican Cuisine</h1>
    </section>

    <main>
        <section class="dish-section">
            <h2>Our Top Dishes</h2>
            
            <div class="row">
                
                <div class="col">
                    <img src="E:\PROJECTS\LuciousFeast\public\mexican\35 Cinco de Mayo Recipes - The Best Mexican Party Food!.jpeg" alt="Cinco de Mayo">
                    <h3>Cinco de Mayo</h3>
                </div>

                <div class="col">
                    <img src="E:\PROJECTS\LuciousFeast\public\mexican\Authentic Entomatadas _ Step By Step Recipe _ Muy Delish.jpeg" alt="Entomatadas">
                    <h3>Entomatadas</h3>
                </div>

                <div class="col">
                    <img src="E:\PROJECTS\LuciousFeast\public\mexican\Crispy Chipotle Sweet Potato Tacos with Lime Crema_.jpeg" alt="Crispy Chipotle">
                    <h3>Crispy Chipotle</h3>
                </div>

                <div class="col">
                    <img src="E:\PROJECTS\LuciousFeast\public\mexican\Healthy Mexican Street Corn (Elotes) _ Elise Tries to Cook.jpeg" alt="Mexican Street Corn">
                    <h3>Mexican Street Corn</h3>
                </div>

                <div class="col">
                    <img src="E:\PROJECTS\LuciousFeast\public\mexican\huevos-a-la-mexicana-mexican-scrumbled-eggs-.jpg" alt="Scrumbled Eggs">
                    <h3>Scrumbled Eggs</h3>
                </div>

                <div class="col">
                    <img src="E:\PROJECTS\LuciousFeast\public\mexican\Sopes de Pollo (chicken sopes).jpeg" alt="Chicken Sopes">
                    <h3>Chicken Sopes</h3>
                </div>

            </div>
        </section>
        
    </main>

    <footer>
        <a href="explore.html">Back to Cuisines</a> 
    </footer>

</body>
</html>
